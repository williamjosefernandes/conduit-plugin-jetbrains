# Overrides on top of detekt's default config.
style:
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  ThrowsCount:
    max: 5
complexity:
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 25
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
exceptions:
  # Process, protocol and tool boundaries must survive any failure of the other side.
  TooGenericExceptionCaught:
    active: false
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
