# Overrides on top of detekt's default config.
style:
  MagicNumber:
    # Sizes, colors and offsets of the Compose UI are design values, named by where they are used.
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  ThrowsCount:
    max: 5
complexity:
  LongMethod:
    # A screen's layout reads top to bottom in one composable; splitting it only scatters the layout.
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Services and view models expose one function per user action (pause, resume, retry, …).
    thresholdInFiles: 35
    thresholdInClasses: 40
    thresholdInInterfaces: 25
    thresholdInObjects: 25
exceptions:
  # Process, protocol and tool boundaries must survive any failure of the other side.
  TooGenericExceptionCaught:
    active: false
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
