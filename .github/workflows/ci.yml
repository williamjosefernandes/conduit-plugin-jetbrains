name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # check = unit tests + platform tests + ktlint + detekt
      - run: ./gradlew check buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-plugin
          path: plugin/build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/"

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest patch of the 3 supported majors; keep in sync with gradle.properties.
        ide: ["2025.3.6.1", "2026.1.5", "2026.2.3"]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyPlugin -PverifyIdeVersions=${{ matrix.ide }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-${{ matrix.ide }}
          path: plugin/build/reports/pluginVerifier/
