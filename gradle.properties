pluginGroup=dev.conduit
pluginVersion=0.1.0

# Build target: oldest supported IDE (baseline). See docs/ARCHITECTURE.md.
platformVersion=2025.3.6.1
pluginSinceBuild=253

# IDEs checked by verifyPlugin (latest patch of the 3 supported majors). CI overrides this per matrix entry.
verifyIdeVersions=2025.3.6.1,2026.1.5,2026.2.3

# The IDE bundles the Kotlin stdlib; never ship our own.
kotlin.stdlib.default.dependency=false
kotlin.code.style=official

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
